<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!--
      Content Security Policy. GitHub Pages can't send headers, so it lives here (frame-ancestors can't be set in a
      meta tag). Scripts only from this origin; styles inline because react-native-web injects them at runtime;
      fonts from Google Fonts. Add the Supabase origin to connect-src in M3, nothing broader.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'self'" />
    <meta name="referrer" content="no-referrer" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web's recommended reset -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background: #000; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Kanjiskole needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
