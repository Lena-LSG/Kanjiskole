name: Idea
description: Suggest a feature or a change to how the app teaches
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The learning problem first; a solution is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
