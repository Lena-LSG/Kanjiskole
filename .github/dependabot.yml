version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Nothing younger than two weeks (same rule as the hand-picked pins).
    cooldown:
      default-days: 14
    groups:
      tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Everything an Expo SDK pins moves only with a deliberate SDK upgrade, taken from that SDK's
      # bundledNativeModules.json. Even a patch can break it: React Native 0.86 needs react exactly 19.2.3.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@types/react"
      # TypeScript majors wait until Expo supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types must match the Node we run (22 in CI and on EAS), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
