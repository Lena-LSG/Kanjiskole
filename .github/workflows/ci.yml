name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run typecheck
      - run: npm test

  web:
    # The app must still bundle for both targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx expo export -p web
        working-directory: app
        env: { EXPO_NO_TELEMETRY: "1", CI: "1" }
      - run: npx expo export -p android --output-dir /tmp/android-dist
        working-directory: app
        env: { EXPO_NO_TELEMETRY: "1", CI: "1" }

  data:
    # The generated data must be exactly what the pinned sources produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data
      - run: git diff --exit-code assets/data
